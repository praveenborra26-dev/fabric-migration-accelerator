window.FMA_SCRIPTS = {"fabric_discovery_db2i.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : IBM Db2 for i (IBM i 7.3 / 7.4 / 7.5 / 7.6)\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : Reads QSYS2 catalog views and services only. No business data\n--                is read. Nothing is created or changed.\n-- Permissions  : *USE on QSYS2 services; *ALLOBJ is not required, but objects you\n--                cannot see are not counted.\n-- How to run   : IBM i Access Client Solutions -> Run SQL Scripts -> Run All,\n--                then export the results to CSV (or save the output as .txt).\n-- Note         : OBJECT_STATISTICS over *ALLUSR can take several minutes.\n-- =============================================================================\nSELECT 'platform,platform,db2i' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,script_version,2026.11' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,version,' || OS_VERSION || '.' || OS_RELEASE FROM SYSIBMADM.ENV_SYS_INFO;\n\nSELECT 'inventory,' || CASE TABLE_TYPE WHEN 'T' THEN 'table_count' WHEN 'P' THEN 'dds_physical_file_count'\n                                       WHEN 'L' THEN 'logical_file_count' WHEN 'V' THEN 'view_count'\n                                       WHEN 'M' THEN 'mqt_count' WHEN 'A' THEN 'alias_count'\n                                       ELSE 'type_' || TABLE_TYPE END || ',' || TRIM(CHAR(COUNT(*)))\n  FROM QSYS2.SYSTABLES WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%' GROUP BY TABLE_TYPE;\nSELECT 'inventory,schema_count,' || TRIM(CHAR(COUNT(DISTINCT TABLE_SCHEMA)))\n  FROM QSYS2.SYSTABLES WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,proc_count,' || TRIM(CHAR(COUNT(*)))\n  FROM QSYS2.SYSROUTINES WHERE ROUTINE_TYPE = 'PROCEDURE' AND ROUTINE_SCHEMA NOT LIKE 'Q%' AND ROUTINE_SCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,function_count,' || TRIM(CHAR(COUNT(*)))\n  FROM QSYS2.SYSROUTINES WHERE ROUTINE_TYPE = 'FUNCTION' AND ROUTINE_SCHEMA NOT LIKE 'Q%' AND ROUTINE_SCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,trigger_count,' || TRIM(CHAR(COUNT(*)))\n  FROM QSYS2.SYSTRIGGERS WHERE TRIGGER_SCHEMA NOT LIKE 'Q%' AND TRIGGER_SCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,program_count,' || TRIM(CHAR(COUNT(*))) FROM TABLE(QSYS2.OBJECT_STATISTICS('*ALLUSR', '*PGM')) X;\n\nSELECT 'size,total_size_gb,' || TRIM(CHAR(DECIMAL(SUM(DATA_SIZE) / 1073741824.0, 18, 2)))\n  FROM QSYS2.SYSTABLESTAT WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%';\nSELECT 'size,total_rows,' || TRIM(CHAR(SUM(NUMBER_ROWS)))\n  FROM QSYS2.SYSTABLESTAT WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%';\nSELECT 'size,largest_table_gb,' || TRIM(CHAR(DECIMAL(MAX(DATA_SIZE) / 1073741824.0, 18, 2)))\n  FROM QSYS2.SYSTABLESTAT WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%';\n\nSELECT 'types,' || K || ',' || TRIM(CHAR(COUNT(*))) FROM (\n  SELECT CASE\n           WHEN DATA_TYPE = 'DECIMAL' THEN 'packed_decimal_columns'\n           WHEN DATA_TYPE = 'NUMERIC' THEN 'zoned_decimal_columns'\n           WHEN DATA_TYPE IN ('GRAPHIC','VARG','VARGRAPHIC','DBCLOB') THEN 'graphic_columns'\n           WHEN DATA_TYPE IN ('BLOB','CLOB') THEN 'lob_columns'\n           WHEN DATA_TYPE = 'XML' THEN 'xml_columns'\n           WHEN DATA_TYPE IN ('CHAR','VARCHAR') AND CCSID NOT IN (1208, 1200, 13488, 65535) THEN 'ebcdic_char_columns'\n           ELSE 'other_columns' END AS K\n    FROM QSYS2.SYSCOLUMNS WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%'\n) X GROUP BY K;\nSELECT 'cdc,journaled_files,' || TRIM(CHAR(COUNT(*)))\n  FROM TABLE(QSYS2.OBJECT_STATISTICS('*ALLUSR', '*FILE')) X WHERE JOURNALED = 'YES';\n\n-- Largest tables (wave planning). Delete this statement to omit names.\nSELECT 'table_top,' || RTRIM(TABLE_SCHEMA) || '.' || RTRIM(TABLE_NAME) || ',' || TRIM(CHAR(DECIMAL(DATA_SIZE / 1073741824.0, 18, 2)))\n  FROM QSYS2.SYSTABLESTAT WHERE TABLE_SCHEMA NOT LIKE 'Q%' AND TABLE_SCHEMA NOT LIKE 'SYS%'\n ORDER BY DATA_SIZE DESC FETCH FIRST 25 ROWS ONLY;\n", "fabric_discovery_db2luw.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : IBM Db2 for Linux, UNIX and Windows 10.5 / 11.1 / 11.5 / 12.1\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : Reads SYSCAT catalog views and MON_* table functions only.\n--                No business data is read. Nothing is created or changed.\n-- Permissions  : CONNECT + catalog SELECT (granted to PUBLIC by default) and\n--                EXECUTE on the MON_GET_* functions (SYSMON authority covers it).\n-- How to run   : db2 connect to <database>\n--                db2 -x -tf fabric_discovery_db2luw.sql -z fabric_discovery_db2luw.csv\n-- Output       : fabric_discovery_db2luw.csv. Error lines from statements that\n--                do not apply to your version are ignored by the importer.\n-- Note         : ADMINTABINFO (largest tables) can take a few minutes on very\n--                large catalogs.\n-- =============================================================================\nSELECT 'platform,platform,db2luw' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,script_version,2026.11' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,version,' || SERVICE_LEVEL FROM SYSIBMADM.ENV_INST_INFO;\nSELECT 'platform,os,' || OS_NAME || ' ' || OS_VERSION FROM SYSIBMADM.ENV_SYS_INFO;\nSELECT 'platform,cpu_count,' || TRIM(CHAR(TOTAL_CPUS)) FROM SYSIBMADM.ENV_SYS_INFO;\nSELECT 'platform,memory_gb,' || TRIM(CHAR(DECIMAL(TOTAL_MEMORY / 1024.0, 18, 1))) FROM SYSIBMADM.ENV_SYS_INFO;\nSELECT 'platform,db_partitions,' || TRIM(CHAR(COUNT(*))) FROM TABLE(DB_PARTITIONS()) AS T;\n\n-- Size\nSELECT 'size,total_size_gb,' || TRIM(CHAR(DECIMAL(SUM(TBSP_USED_PAGES * TBSP_PAGE_SIZE) / 1073741824.0, 18, 2)))\n  FROM TABLE(MON_GET_TABLESPACE('', -2)) AS T WHERE TBSP_CONTENT_TYPE IN ('ANY', 'LARGE');\nSELECT 'size,total_rows,' || TRIM(CHAR(SUM(BIGINT(CARD))))\n  FROM SYSCAT.TABLES WHERE TYPE = 'T' AND CARD > 0\n   AND TABSCHEMA NOT LIKE 'SYS%' AND TABSCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS');\nSELECT 'size,largest_table_gb,' || TRIM(CHAR(DECIMAL(MAX(DATA_OBJECT_P_SIZE + INDEX_OBJECT_P_SIZE + LONG_OBJECT_P_SIZE + LOB_OBJECT_P_SIZE + XML_OBJECT_P_SIZE) / 1048576.0, 18, 2)))\n  FROM SYSIBMADM.ADMINTABINFO WHERE TABSCHEMA NOT LIKE 'SYS%';\n\n-- Inventory\nSELECT 'inventory,' || CASE TYPE WHEN 'T' THEN 'table_count' WHEN 'V' THEN 'view_count' WHEN 'S' THEN 'mqt_count'\n                                 WHEN 'A' THEN 'alias_count' WHEN 'N' THEN 'nickname_count' WHEN 'G' THEN 'created_temp_count'\n                                 ELSE 'type_' || TYPE END || ',' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.TABLES\n WHERE TABSCHEMA NOT LIKE 'SYS%' AND TABSCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS')\n GROUP BY TYPE;\nSELECT 'inventory,schema_count,' || TRIM(CHAR(COUNT(DISTINCT TABSCHEMA)))\n  FROM SYSCAT.TABLES WHERE TYPE = 'T'\n   AND TABSCHEMA NOT LIKE 'SYS%' AND TABSCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS');\nSELECT 'inventory,column_organized_table_count,' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.TABLES WHERE TYPE = 'T' AND TABLEORG = 'C' AND TABSCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,partitioned_table_count,' || TRIM(CHAR(COUNT(DISTINCT TABSCHEMA || '.' || TABNAME)))\n  FROM SYSCAT.DATAPARTITIONS WHERE SEQNO > 0 AND TABSCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,' || CASE ROUTINETYPE WHEN 'P' THEN 'proc_count' WHEN 'F' THEN 'function_count' ELSE 'method_count' END\n       || ',' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.ROUTINES\n WHERE ROUTINESCHEMA NOT LIKE 'SYS%' AND ROUTINESCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS')\n GROUP BY ROUTINETYPE;\nSELECT 'inventory,external_routine_count,' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.ROUTINES WHERE ORIGIN = 'E' AND LANGUAGE <> 'SQL'\n   AND ROUTINESCHEMA NOT LIKE 'SYS%' AND ROUTINESCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS');\nSELECT 'inventory,trigger_count,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.TRIGGERS WHERE TRIGSCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,sequence_count,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.SEQUENCES WHERE SEQTYPE = 'S' AND SEQSCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,package_count,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.PACKAGES\n WHERE PKGSCHEMA NOT IN ('NULLID','NULLIDR1','NULLIDRA') AND PKGSCHEMA NOT LIKE 'SYS%';\nSELECT 'inventory,federated_server_count,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.SERVERS;\n\n-- SQL PL code volume and feature usage\nSELECT 'code,code_chars,' || TRIM(CHAR(SUM(BIGINT(LENGTH(TEXT)))))\n  FROM SYSCAT.ROUTINES WHERE LANGUAGE = 'SQL' AND ORIGIN = 'Q'\n   AND ROUTINESCHEMA NOT LIKE 'SYS%' AND ROUTINESCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS');\nSELECT 'code,code_lines,' || TRIM(CHAR(SUM(BIGINT(LENGTH(TEXT) - LENGTH(REPLACE(TEXT, CHR(10), '')) + 1))))\n  FROM SYSCAT.ROUTINES WHERE LANGUAGE = 'SQL' AND ORIGIN = 'Q'\n   AND ROUTINESCHEMA NOT LIKE 'SYS%' AND ROUTINESCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS');\nSELECT 'code,trigger_chars,' || TRIM(CHAR(SUM(BIGINT(LENGTH(TEXT))))) FROM SYSCAT.TRIGGERS WHERE TRIGSCHEMA NOT LIKE 'SYS%';\nSELECT 'code,cursor_objects,' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.ROUTINES WHERE LANGUAGE = 'SQL' AND ORIGIN = 'Q' AND UPPER(TEXT) LIKE '%CURSOR%' AND ROUTINESCHEMA NOT LIKE 'SYS%';\nSELECT 'code,dynamic_sql_objects,' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.ROUTINES WHERE LANGUAGE = 'SQL' AND ORIGIN = 'Q'\n   AND (UPPER(TEXT) LIKE '%EXECUTE IMMEDIATE%' OR UPPER(TEXT) LIKE '%PREPARE %') AND ROUTINESCHEMA NOT LIKE 'SYS%';\nSELECT 'code,merge_objects,' || TRIM(CHAR(COUNT(*)))\n  FROM SYSCAT.ROUTINES WHERE LANGUAGE = 'SQL' AND ORIGIN = 'Q' AND UPPER(TEXT) LIKE '%MERGE INTO%' AND ROUTINESCHEMA NOT LIKE 'SYS%';\n\n-- Column data types that need attention in Fabric\nSELECT 'types,' || K || ',' || TRIM(CHAR(COUNT(*))) FROM (\n  SELECT CASE\n           WHEN C.TYPENAME IN ('GRAPHIC','VARGRAPHIC','LONG VARGRAPHIC') THEN 'graphic_columns'\n           WHEN C.TYPENAME IN ('BLOB','CLOB','DBCLOB') THEN 'lob_columns'\n           WHEN C.TYPENAME = 'XML' THEN 'xml_columns'\n           WHEN C.TYPENAME = 'DECFLOAT' THEN 'decfloat_columns'\n           WHEN C.TYPENAME = 'TIMESTAMP' AND C.SCALE > 6 THEN 'ts_precision_columns'\n           WHEN C.TYPESCHEMA = 'DB2GSE' THEN 'spatial_columns'\n           WHEN C.TYPESCHEMA NOT LIKE 'SYSIBM%' THEN 'udt_columns'\n           ELSE 'other_columns' END AS K\n    FROM SYSCAT.COLUMNS C\n    JOIN SYSCAT.TABLES T ON T.TABSCHEMA = C.TABSCHEMA AND T.TABNAME = C.TABNAME\n   WHERE T.TYPE = 'T'\n     AND T.TABSCHEMA NOT LIKE 'SYS%' AND T.TABSCHEMA NOT IN ('SQLJ','NULLID','DB2QP','IBM_RTMON','ASN','DB2GSE','DB2OE','IBMOTS')\n) X GROUP BY K;\n\n-- Workload (counters since database activation)\nSELECT 'workload,daily_activities,' || TRIM(CHAR(BIGINT(SUM(ACT_COMPLETED_TOTAL) / MAX(1, DAYS(CURRENT TIMESTAMP) - DAYS(MIN(DB_CONN_TIME))))))\n  FROM TABLE(MON_GET_DATABASE(-2)) AS T;\nSELECT 'workload,peak_connections,' || TRIM(CHAR(MAX(CONNECTIONS_TOP))) FROM TABLE(MON_GET_DATABASE(-2)) AS T;\nSELECT 'workload,user_count,' || TRIM(CHAR(COUNT(DISTINCT GRANTEE))) FROM SYSCAT.DBAUTH WHERE GRANTEETYPE = 'U' AND CONNECTAUTH = 'Y';\nSELECT 'client_app,' || COALESCE(APPLICATION_NAME, '(unknown)') || ',' || TRIM(CHAR(COUNT(*)))\n  FROM TABLE(MON_GET_CONNECTION(NULL, -2)) AS T GROUP BY APPLICATION_NAME ORDER BY COUNT(*) DESC FETCH FIRST 25 ROWS ONLY;\n\n-- Change data capture readiness and security\nSELECT 'cdc,log_archive_method,' || COALESCE(VALUE, '') FROM SYSIBMADM.DBCFG WHERE NAME = 'logarchmeth1';\nSELECT 'cdc,data_capture_tables,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.TABLES WHERE DATACAPTURE IN ('Y','L') AND TABSCHEMA NOT LIKE 'SYS%';\nSELECT 'security,rcac_controls,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.CONTROLS;\nSELECT 'security,lbac_policies,' || TRIM(CHAR(COUNT(*))) FROM SYSCAT.SECURITYPOLICIES;\n\n-- Largest tables (wave planning). Delete this statement to omit table names.\nSELECT 'table_top,' || RTRIM(TABSCHEMA) || '.' || RTRIM(TABNAME) || ','\n       || TRIM(CHAR(DECIMAL((DATA_OBJECT_P_SIZE + INDEX_OBJECT_P_SIZE + LONG_OBJECT_P_SIZE + LOB_OBJECT_P_SIZE + XML_OBJECT_P_SIZE) / 1048576.0, 18, 2)))\n  FROM SYSIBMADM.ADMINTABINFO WHERE TABSCHEMA NOT LIKE 'SYS%'\n ORDER BY (DATA_OBJECT_P_SIZE + INDEX_OBJECT_P_SIZE + LONG_OBJECT_P_SIZE + LOB_OBJECT_P_SIZE + XML_OBJECT_P_SIZE) DESC\n FETCH FIRST 25 ROWS ONLY;\n", "fabric_discovery_db2zos.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : IBM Db2 for z/OS 11 / 12 / 13\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : Reads SYSIBM catalog tables and real-time statistics only.\n--                No business data is read. Nothing is created or changed.\n-- Permissions  : SELECT on the SYSIBM catalog (SYSADM, SYSCTRL or a catalog\n--                read role).\n-- How to run   : SPUFI, DSNTEP2/DSNTEP4 batch, IBM Data Studio / Db2 Developer\n--                Extension, or any JDBC client through Db2 Connect.\n--                Save every result row into one .csv or .txt file (SPUFI output\n--                is fine: the importer reads lines that start with a section name).\n-- Mainframe    : Workload (MIPS), CICS/IMS usage, VSAM/sequential files and\n--                COBOL copybooks are not in the catalog: record them in the\n--                accelerator's intake for this system.\n-- =============================================================================\nSELECT 'platform,platform,db2zos' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,script_version,2026.11' FROM SYSIBM.SYSDUMMY1;\nSELECT 'platform,version,' || GETVARIABLE('SYSIBM.VERSION') FROM SYSIBM.SYSDUMMY1;\n\nSELECT 'inventory,' || CASE TYPE WHEN 'T' THEN 'table_count' WHEN 'V' THEN 'view_count' WHEN 'M' THEN 'mqt_count'\n                                 WHEN 'A' THEN 'alias_count' WHEN 'G' THEN 'created_temp_count' WHEN 'X' THEN 'aux_table_count'\n                                 ELSE 'type_' || TYPE END || ',' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSTABLES WHERE CREATOR NOT LIKE 'SYS%' AND CREATOR NOT LIKE 'DSN%' GROUP BY TYPE;\nSELECT 'inventory,schema_count,' || STRIP(CHAR(COUNT(DISTINCT CREATOR)))\n  FROM SYSIBM.SYSTABLES WHERE TYPE = 'T' AND CREATOR NOT LIKE 'SYS%' AND CREATOR NOT LIKE 'DSN%';\nSELECT 'inventory,database_count,' || STRIP(CHAR(COUNT(*))) FROM SYSIBM.SYSDATABASE WHERE NAME NOT LIKE 'DSN%';\nSELECT 'inventory,proc_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSROUTINES WHERE ROUTINETYPE = 'P' AND SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,native_sql_proc_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSROUTINES WHERE ROUTINETYPE = 'P' AND ORIGIN = 'N' AND SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,external_routine_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSROUTINES WHERE ORIGIN = 'E' AND SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,function_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSROUTINES WHERE ROUTINETYPE = 'F' AND SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,trigger_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSTRIGGERS WHERE SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,sequence_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSSEQUENCES WHERE SEQTYPE = 'S' AND SCHEMA NOT LIKE 'SYS%' AND SCHEMA NOT LIKE 'DSN%';\nSELECT 'inventory,package_count,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSPACKAGE WHERE COLLID NOT LIKE 'DSN%' AND COLLID NOT LIKE 'SYS%';\nSELECT 'inventory,plan_count,' || STRIP(CHAR(COUNT(*))) FROM SYSIBM.SYSPLAN WHERE NAME NOT LIKE 'DSN%';\n\n-- Size from real-time statistics (SPACE is in KB)\nSELECT 'size,total_size_gb,' || STRIP(CHAR(DECIMAL(SUM(SPACE) / 1048576.0, 18, 2)))\n  FROM SYSIBM.SYSTABLESPACESTATS WHERE DBNAME NOT LIKE 'DSN%';\nSELECT 'size,total_rows,' || STRIP(CHAR(BIGINT(SUM(TOTALROWS))))\n  FROM SYSIBM.SYSTABLESPACESTATS WHERE DBNAME NOT LIKE 'DSN%';\nSELECT 'size,largest_table_gb,' || STRIP(CHAR(DECIMAL(MAX(SPACE) / 1048576.0, 18, 2)))\n  FROM SYSIBM.SYSTABLESPACESTATS WHERE DBNAME NOT LIKE 'DSN%';\n\n-- Column data types, encoding and change data capture\nSELECT 'types,' || K || ',' || STRIP(CHAR(COUNT(*))) FROM (\n  SELECT CASE\n           WHEN C.COLTYPE IN ('GRAPHIC','VARG','LONGVARG') THEN 'graphic_columns'\n           WHEN C.COLTYPE IN ('BLOB','CLOB','DBCLOB') THEN 'lob_columns'\n           WHEN C.COLTYPE = 'XML' THEN 'xml_columns'\n           WHEN C.COLTYPE = 'DECFLOAT' THEN 'decfloat_columns'\n           WHEN C.COLTYPE = 'ROWID' THEN 'rowid_columns'\n           WHEN C.COLTYPE = 'TIMESTZ' THEN 'tz_columns'\n           WHEN C.COLTYPE = 'DISTINCT' THEN 'udt_columns'\n           ELSE 'other_columns' END AS K\n    FROM SYSIBM.SYSCOLUMNS C\n    JOIN SYSIBM.SYSTABLES T ON T.CREATOR = C.TBCREATOR AND T.NAME = C.TBNAME\n   WHERE T.TYPE = 'T' AND T.CREATOR NOT LIKE 'SYS%' AND T.CREATOR NOT LIKE 'DSN%'\n) X GROUP BY K;\nSELECT 'types,ebcdic_tables,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSTABLES WHERE TYPE = 'T' AND ENCODING_SCHEME = 'E' AND CREATOR NOT LIKE 'SYS%' AND CREATOR NOT LIKE 'DSN%';\nSELECT 'cdc,data_capture_tables,' || STRIP(CHAR(COUNT(*)))\n  FROM SYSIBM.SYSTABLES WHERE TYPE = 'T' AND DATACAPTURE = 'Y' AND CREATOR NOT LIKE 'SYS%' AND CREATOR NOT LIKE 'DSN%';\nSELECT 'security,rcac_controls,' || STRIP(CHAR(COUNT(*))) FROM SYSIBM.SYSCONTROLS;\nSELECT 'workload,user_count,' || STRIP(CHAR(COUNT(DISTINCT GRANTEE)))\n  FROM SYSIBM.SYSTABAUTH WHERE GRANTEETYPE = ' ' AND GRANTEE <> 'PUBLIC';\n\n-- Largest table spaces (wave planning). Delete this statement to omit names.\nSELECT 'table_top,' || STRIP(DBNAME) || '.' || STRIP(NAME) || ',' || STRIP(CHAR(DECIMAL(SUM(SPACE) / 1048576.0, 18, 2)))\n  FROM SYSIBM.SYSTABLESPACESTATS WHERE DBNAME NOT LIKE 'DSN%'\n GROUP BY DBNAME, NAME ORDER BY SUM(SPACE) DESC FETCH FIRST 25 ROWS ONLY;\n", "fabric_discovery_hana_native.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : SAP HANA native / sidecar (non-ABAP schemas, calculation views)\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : One read-only query over HANA system views (SYS.TABLES, VIEWS,\n--                PROCEDURES, M_TABLE_PERSISTENCE_STATISTICS). No business data.\n-- Permissions  : CATALOG READ.\n-- How to run   : SAP HANA Database Explorer / HANA Studio / hdbsql -> run ->\n--                export the grid as CSV.\n-- Scope        : All non-system schemas. Add AND SCHEMA_NAME IN (...) filters\n--                if the database also hosts schemas that are out of scope.\n-- =============================================================================\nSELECT CAST('platform' AS NVARCHAR(40)) AS SEC, CAST('platform' AS NVARCHAR(256)) AS METRIC_NAME, CAST('sap_hana' AS NVARCHAR(1000)) AS METRIC_VALUE FROM DUMMY\nUNION ALL SELECT 'platform', 'script_version', '2026.11' FROM DUMMY\nUNION ALL SELECT 'platform', 'version', VERSION FROM SYS.M_DATABASE\nUNION ALL SELECT 'size', 'total_size_gb', TO_VARCHAR(ROUND(SUM(DISK_SIZE) / 1073741824, 2))\n            FROM SYS.M_TABLE_PERSISTENCE_STATISTICS\n           WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM','UIS','HANA_XS_BASE','SAP_REST_API','SAPDBCTRL')\nUNION ALL SELECT 'inventory', 'schema_count', TO_VARCHAR(COUNT(*)) FROM SYS.SCHEMAS\n           WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM','UIS','HANA_XS_BASE','SAP_REST_API','SAPDBCTRL')\nUNION ALL SELECT 'inventory', 'table_count', TO_VARCHAR(COUNT(*)) FROM SYS.TABLES\n           WHERE IS_SYSTEM_TABLE = 'FALSE' AND SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'inventory', 'view_count', TO_VARCHAR(COUNT(*)) FROM SYS.VIEWS\n           WHERE VIEW_TYPE <> 'CALC' AND SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'inventory', 'calc_view_count', TO_VARCHAR(COUNT(*)) FROM SYS.VIEWS\n           WHERE VIEW_TYPE = 'CALC' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'inventory', 'proc_count', TO_VARCHAR(COUNT(*)) FROM SYS.PROCEDURES\n           WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'inventory', 'function_count', TO_VARCHAR(COUNT(*)) FROM SYS.FUNCTIONS\n           WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'code', 'code_chars', TO_VARCHAR(SUM(LENGTH(DEFINITION))) FROM SYS.PROCEDURES\n           WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT 'workload', 'user_count', TO_VARCHAR(COUNT(*)) FROM SYS.USERS\n           WHERE USER_DEACTIVATED = 'FALSE' AND USER_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND USER_NAME NOT IN ('SYS','SYSTEM')\nUNION ALL SELECT * FROM (\n            SELECT TOP 25 'table_top', SCHEMA_NAME || '.' || TABLE_NAME, TO_VARCHAR(ROUND(DISK_SIZE / 1073741824, 2))\n              FROM SYS.M_TABLE_PERSISTENCE_STATISTICS\n             WHERE SCHEMA_NAME NOT LIKE '\\_SYS%' ESCAPE '\\' AND SCHEMA_NAME NOT IN ('SYS','SYSTEM')\n             ORDER BY DISK_SIZE DESC);\n", "fabric_discovery_oracle.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : Oracle Database 11g R2+ (incl. RAC, Exadata, OCI, PDBs)\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : Reads data dictionary (DBA_*) and V$ views only. No business\n--                data is read. Does NOT touch AWR/ASH, so no Diagnostics Pack\n--                licence is needed. Nothing is created or changed.\n-- Permissions  : SELECT_CATALOG_ROLE (or SELECT ANY DICTIONARY).\n-- How to run   : sqlplus user/password@service @fabric_discovery_oracle.sql\n--                SQLcl works too. In a multitenant CDB, connect to the PDB.\n-- Output       : fabric_discovery_oracle.csv in the current directory.\n--                Import it in the accelerator: Automate -> Discovery scripts.\n-- Privacy      : Set v_names := FALSE below to omit the top-25 table names.\n-- =============================================================================\nSET SERVEROUTPUT ON SIZE UNLIMITED FORMAT WRAPPED\nSET FEEDBACK OFF HEADING OFF PAGESIZE 0 LINESIZE 4000 TRIMSPOOL ON TRIMOUT ON VERIFY OFF ECHO OFF TERMOUT OFF\nSPOOL fabric_discovery_oracle.csv\nDECLARE\n  v_names BOOLEAN := TRUE;\n  -- Oracle-maintained and sample schemas excluded from every count\n  x CONSTANT VARCHAR2(4000) := q'[ NOT IN ('SYS','SYSTEM','OUTLN','DBSNMP','APPQOSSYS','AUDSYS','CTXSYS','DVSYS','DVF',\n    'GSMADMIN_INTERNAL','GSMCATUSER','GSMUSER','GSMROOTUSER','LBACSYS','MDSYS','MDDATA','OJVMSYS','OLAPSYS','ORDDATA',\n    'ORDPLUGINS','ORDSYS','SI_INFORMTN_SCHEMA','WMSYS','XDB','EXFSYS','ORACLE_OCM','SPATIAL_CSW_ADMIN_USR',\n    'SPATIAL_WFS_ADMIN_USR','ANONYMOUS','XS$NULL','DIP','SYSBACKUP','SYSDG','SYSKM','SYSRAC','REMOTE_SCHEDULER_AGENT',\n    'DBSFWUSER','GGSYS','PDBADMIN','OWBSYS','OWBSYS_AUDIT','SYSMAN','MGMT_VIEW','TSMSYS','DGPDB_INT','VECSYS','PUBLIC',\n    'FLOWS_FILES','APEX_PUBLIC_USER','SCOTT','HR','OE','PM','IX','SH','BI')\n    AND {c} NOT LIKE 'APEX\\_%' ESCAPE '\\' AND {c} NOT LIKE 'FLOWS\\_%' ESCAPE '\\' ]';\n\n  FUNCTION ex(p_col VARCHAR2) RETURN VARCHAR2 IS\n  BEGIN\n    RETURN ' ' || p_col || REPLACE(x, '{c}', p_col) || ' ';\n  END;\n\n  PROCEDURE emit(s VARCHAR2, m VARCHAR2, v VARCHAR2) IS\n  BEGIN\n    DBMS_OUTPUT.PUT_LINE(s || ',' || m || ',' || REPLACE(REPLACE(REPLACE(v, ',', ' '), CHR(10), ' '), CHR(13), ' '));\n  END;\n\n  -- single value\n  PROCEDURE q(s VARCHAR2, m VARCHAR2, p_sql VARCHAR2) IS\n    v VARCHAR2(4000);\n  BEGIN\n    EXECUTE IMMEDIATE p_sql INTO v;\n    emit(s, m, NVL(v, '0'));\n  EXCEPTION WHEN OTHERS THEN\n    emit('error', m, SUBSTR(SQLERRM, 1, 300));\n  END;\n\n  -- several rows: the query returns (metric, value)\n  PROCEDURE qm(s VARCHAR2, p_sql VARCHAR2) IS\n    c SYS_REFCURSOR;\n    m VARCHAR2(400);\n    v VARCHAR2(4000);\n  BEGIN\n    OPEN c FOR p_sql;\n    LOOP\n      FETCH c INTO m, v;\n      EXIT WHEN c%NOTFOUND;\n      emit(s, m, v);\n    END LOOP;\n    CLOSE c;\n  EXCEPTION WHEN OTHERS THEN\n    emit('error', s, SUBSTR(SQLERRM, 1, 300));\n  END;\nBEGIN\n  emit('section', 'metric', 'value');\n  emit('platform', 'platform', 'oracle');\n  emit('platform', 'script_version', '2026.11');\n\n  -- Platform\n  q('platform', 'version',        'SELECT version FROM v$instance');\n  q('platform', 'banner',         'SELECT banner FROM v$version WHERE ROWNUM = 1');\n  q('platform', 'cpu_count',      q'[SELECT value FROM v$parameter WHERE name = 'cpu_count']');\n  q('platform', 'sga_gb',         'SELECT TO_CHAR(ROUND(SUM(value) / 1073741824, 1)) FROM v$sga');\n  q('platform', 'instance_count', 'SELECT TO_CHAR(COUNT(*)) FROM gv$instance');\n  q('platform', 'exadata_cells',  'SELECT TO_CHAR(COUNT(*)) FROM v$cell');\n  q('platform', 'is_cdb',         'SELECT cdb FROM v$database');\n  q('platform', 'charset',        q'[SELECT value FROM nls_database_parameters WHERE parameter = 'NLS_CHARACTERSET']');\n  q('platform', 'uptime_days',    'SELECT TO_CHAR(ROUND(SYSDATE - startup_time, 1)) FROM v$instance');\n\n  -- Change data capture readiness (Fabric mirroring for Oracle needs LogMiner + ARCHIVELOG)\n  q('cdc', 'archivelog_mode',      'SELECT log_mode FROM v$database');\n  q('cdc', 'supplemental_logging', 'SELECT supplemental_log_data_min FROM v$database');\n  q('cdc', 'goldengate_enabled',   q'[SELECT value FROM v$parameter WHERE name = 'enable_goldengate_replication']');\n\n  -- Size\n  q('size', 'total_size_gb',    'SELECT TO_CHAR(ROUND(SUM(bytes) / 1073741824, 2)) FROM dba_segments WHERE' || ex('owner'));\n  q('size', 'datafile_size_gb', 'SELECT TO_CHAR(ROUND(SUM(bytes) / 1073741824, 2)) FROM dba_data_files');\n  q('size', 'lob_size_gb',      q'[SELECT TO_CHAR(ROUND(SUM(bytes) / 1073741824, 2)) FROM dba_segments WHERE segment_type LIKE 'LOB%' AND]' || ex('owner'));\n  q('size', 'largest_table_gb', q'[SELECT TO_CHAR(ROUND(MAX(s) / 1073741824, 2)) FROM (SELECT owner, segment_name, SUM(bytes) s\n                                   FROM dba_segments WHERE segment_type LIKE 'TABLE%' AND]' || ex('owner') || ' GROUP BY owner, segment_name)');\n  q('size', 'total_rows',       'SELECT TO_CHAR(SUM(num_rows)) FROM dba_tables WHERE' || ex('owner'));\n\n  -- Inventory\n  q('inventory', 'schema_count',            'SELECT TO_CHAR(COUNT(DISTINCT owner)) FROM dba_objects WHERE' || ex('owner'));\n  q('inventory', 'table_count',             q'[SELECT TO_CHAR(COUNT(*)) FROM dba_tables WHERE temporary = 'N' AND secondary = 'N' AND nested = 'NO' AND dropped = 'NO' AND]' || ex('owner'));\n  q('inventory', 'gtt_count',               q'[SELECT TO_CHAR(COUNT(*)) FROM dba_tables WHERE temporary = 'Y' AND]' || ex('owner'));\n  q('inventory', 'external_table_count',    'SELECT TO_CHAR(COUNT(*)) FROM dba_external_tables WHERE' || ex('owner'));\n  q('inventory', 'partitioned_table_count', 'SELECT TO_CHAR(COUNT(*)) FROM dba_part_tables WHERE' || ex('owner'));\n  q('inventory', 'iot_count',               q'[SELECT TO_CHAR(COUNT(*)) FROM dba_tables WHERE iot_type = 'IOT' AND]' || ex('owner'));\n  q('inventory', 'view_count',              'SELECT TO_CHAR(COUNT(*)) FROM dba_views WHERE' || ex('owner'));\n  q('inventory', 'mview_count',             'SELECT TO_CHAR(COUNT(*)) FROM dba_mviews WHERE' || ex('owner'));\n  qm('inventory', q'[SELECT CASE object_type\n        WHEN 'PACKAGE' THEN 'package_count' WHEN 'PACKAGE BODY' THEN 'package_body_count'\n        WHEN 'PROCEDURE' THEN 'proc_count' WHEN 'FUNCTION' THEN 'function_count'\n        WHEN 'TRIGGER' THEN 'trigger_count' WHEN 'SEQUENCE' THEN 'sequence_count'\n        WHEN 'SYNONYM' THEN 'synonym_count' WHEN 'TYPE' THEN 'type_count'\n        WHEN 'JAVA CLASS' THEN 'java_class_count' END, TO_CHAR(COUNT(*))\n      FROM dba_objects\n      WHERE object_type IN ('PACKAGE','PACKAGE BODY','PROCEDURE','FUNCTION','TRIGGER','SEQUENCE','SYNONYM','TYPE','JAVA CLASS') AND]'\n      || ex('owner') || ' GROUP BY object_type');\n  q('inventory', 'dblink_count',         q'[SELECT TO_CHAR(COUNT(*)) FROM dba_db_links WHERE owner <> 'SYS']');\n  q('inventory', 'invalid_object_count', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_objects WHERE status = 'INVALID' AND]' || ex('owner'));\n\n  -- Scheduling\n  q('etl', 'scheduler_jobs', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_scheduler_jobs WHERE enabled = 'TRUE' AND]' || ex('owner'));\n  q('etl', 'legacy_jobs',    'SELECT TO_CHAR(COUNT(*)) FROM dba_jobs WHERE' || ex('schema_user'));\n\n  -- PL/SQL code volume and feature usage (distinct program units)\n  q('code', 'code_lines', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_source WHERE type IN ('PACKAGE','PACKAGE BODY','PROCEDURE','FUNCTION','TRIGGER','TYPE BODY') AND]' || ex('owner'));\n  q('code', 'wrapped_objects', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_source WHERE line = 1 AND UPPER(text) LIKE '%WRAPPED%' AND]' || ex('owner'));\n  qm('code', q'[SELECT f, TO_CHAR(COUNT(DISTINCT owner || '.' || name || '.' || type)) FROM (\n        SELECT owner, name, type, CASE\n          WHEN UPPER(text) LIKE '%CONNECT BY%' THEN 'connect_by_objects'\n          WHEN UPPER(text) LIKE '%AUTONOMOUS_TRANSACTION%' THEN 'autonomous_tx_objects'\n          WHEN UPPER(text) LIKE '%BULK COLLECT%' OR UPPER(text) LIKE '%FORALL %' THEN 'bulk_objects'\n          WHEN UPPER(text) LIKE '%EXECUTE IMMEDIATE%' OR UPPER(text) LIKE '%DBMS_SQL.%' THEN 'dynamic_sql_objects'\n          WHEN UPPER(text) LIKE '%UTL_FILE.%' OR UPPER(text) LIKE '%UTL_HTTP.%' OR UPPER(text) LIKE '%UTL_SMTP.%' THEN 'utl_objects'\n          WHEN UPPER(text) LIKE '%MERGE INTO%' THEN 'merge_objects'\n          WHEN UPPER(text) LIKE '%REF CURSOR%' OR UPPER(text) LIKE '%SYS_REFCURSOR%' THEN 'refcursor_objects'\n          WHEN UPPER(text) LIKE '%CURSOR %' THEN 'cursor_objects'\n        END f\n        FROM dba_source WHERE]' || ex('owner') || q'[) WHERE f IS NOT NULL GROUP BY f]');\n  q('code', 'connect_by_views', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_views WHERE UPPER(text_vc) LIKE '%CONNECT BY%' AND]' || ex('owner'));\n\n  -- Column data types that need attention in Fabric\n  qm('types', q'[SELECT k, TO_CHAR(COUNT(*)) FROM (\n        SELECT CASE\n          WHEN c.data_type = 'NUMBER' AND c.data_precision IS NULL AND c.data_scale IS NULL THEN 'number_noprecision_columns'\n          WHEN c.data_type IN ('CLOB','NCLOB','BLOB','BFILE','LONG','LONG RAW') THEN 'lob_columns'\n          WHEN c.data_type = 'XMLTYPE' THEN 'xml_columns'\n          WHEN c.data_type = 'SDO_GEOMETRY' THEN 'spatial_columns'\n          WHEN c.data_type IN ('NCHAR','NVARCHAR2') THEN 'nchar_columns'\n          WHEN c.data_type LIKE 'TIMESTAMP%TIME ZONE' THEN 'tz_columns'\n          WHEN c.data_type LIKE 'INTERVAL%' THEN 'interval_columns'\n          WHEN c.data_type IN ('ROWID','UROWID') THEN 'rowid_columns'\n          WHEN c.data_type_owner IS NOT NULL AND c.data_type_owner NOT IN ('SYS','PUBLIC','MDSYS') THEN 'udt_columns'\n          ELSE 'other_columns' END k\n        FROM dba_tab_columns c\n        WHERE EXISTS (SELECT 1 FROM dba_tables t WHERE t.owner = c.owner AND t.table_name = c.table_name) AND]' || ex('c.owner') || q'[) GROUP BY k]');\n\n  -- Workload (no AWR: counters since instance startup)\n  q('workload', 'user_count',       q'[SELECT TO_CHAR(COUNT(*)) FROM dba_users WHERE account_status = 'OPEN' AND]' || ex('username'));\n  q('workload', 'sessions_max',     q'[SELECT TO_CHAR(max_utilization) FROM v$resource_limit WHERE resource_name = 'sessions']');\n  q('workload', 'daily_user_calls', q'[SELECT TO_CHAR(ROUND(s.value / GREATEST(SYSDATE - i.startup_time, 1))) FROM v$sysstat s, v$instance i WHERE s.name = 'user calls']');\n  q('workload', 'daily_executions', q'[SELECT TO_CHAR(ROUND(s.value / GREATEST(SYSDATE - i.startup_time, 1))) FROM v$sysstat s, v$instance i WHERE s.name = 'execute count']');\n  -- Client programs connected right now (host names stripped) - helps detect ETL/BI tools\n  qm('client_app', q'[SELECT * FROM (\n        SELECT NVL(TRIM(REGEXP_SUBSTR(program, '^[^@(]+')), '(unknown)'), TO_CHAR(COUNT(*))\n        FROM v$session WHERE type = 'USER'\n        GROUP BY NVL(TRIM(REGEXP_SUBSTR(program, '^[^@(]+')), '(unknown)')\n        ORDER BY COUNT(*) DESC) WHERE ROWNUM <= 25]');\n\n  -- Security features\n  q('security', 'vpd_policies',          'SELECT TO_CHAR(COUNT(*)) FROM dba_policies WHERE' || ex('object_owner'));\n  q('security', 'redaction_policies',    'SELECT TO_CHAR(COUNT(*)) FROM redaction_policies');\n  q('security', 'encrypted_tablespaces', q'[SELECT TO_CHAR(COUNT(*)) FROM dba_tablespaces WHERE encrypted = 'YES']');\n  q('security', 'ols_installed',         q'[SELECT TO_CHAR(COUNT(*)) FROM dba_registry WHERE comp_id = 'OLS' AND status = 'VALID']');\n\n  -- Largest tables (wave planning)\n  IF v_names THEN\n    qm('table_top', q'[SELECT owner || '.' || segment_name, TO_CHAR(ROUND(s / 1073741824, 2)) FROM (\n          SELECT owner, segment_name, SUM(bytes) s FROM dba_segments\n          WHERE segment_type LIKE 'TABLE%' AND]' || ex('owner') || q'[\n          GROUP BY owner, segment_name ORDER BY s DESC) WHERE ROWNUM <= 25]');\n  END IF;\nEND;\n/\nSPOOL OFF\nSET TERMOUT ON\nPROMPT Done. Output written to fabric_discovery_oracle.csv\n", "fabric_discovery_sap_bw_hana.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : SAP BW 7.3 / 7.4 / 7.5 and SAP BW/4HANA on SAP HANA\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : Read-only counts of BW metadata (InfoObjects, queries, process\n--                chains, transformations, DataSources, providers). No data read.\n-- BEFORE RUNNING: Confirm with SAP Basis that direct SQL reads are allowed under\n--                your HANA licence; otherwise use the transaction checklist.\n-- How to run   : Replace SAPHANADB with your BW ABAP schema and run QUERY 1.\n--                Then run QUERY 2 (BW 7.4+ and BW/4HANA) and/or QUERY 3 (classic\n--                BW objects, not on BW/4HANA). Export each grid as CSV; the\n--                importer accepts several files for the same system.\n-- =============================================================================\nSET SCHEMA SAPHANADB;\n\n-- QUERY 1 - all BW releases\nSELECT CAST('platform' AS NVARCHAR(40)) AS SEC, CAST('platform' AS NVARCHAR(256)) AS METRIC_NAME, CAST('sap_bw' AS NVARCHAR(1000)) AS METRIC_VALUE FROM DUMMY\nUNION ALL SELECT 'platform', 'script_version', '2026.11' FROM DUMMY\nUNION ALL SELECT 'platform', 'db', 'hana' FROM DUMMY\nUNION ALL SELECT 'platform', 'hana_version', VERSION FROM SYS.M_DATABASE\nUNION ALL SELECT 'size', 'total_size_gb', TO_VARCHAR(ROUND(SUM(DISK_SIZE) / 1073741824, 2))\n            FROM SYS.M_TABLE_PERSISTENCE_STATISTICS WHERE SCHEMA_NAME = CURRENT_SCHEMA\nUNION ALL SELECT 'bw', 'infoobjects', TO_VARCHAR(COUNT(*)) FROM RSDIOBJ WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'queries', TO_VARCHAR(COUNT(*)) FROM RSZCOMPDIR WHERE OBJVERS = 'A' AND DEFTP = 'REP'\nUNION ALL SELECT 'bw', 'process_chains', TO_VARCHAR(COUNT(DISTINCT CHAIN_ID)) FROM RSPCCHAIN WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'transformations', TO_VARCHAR(COUNT(*)) FROM RSTRAN WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'datasources', TO_VARCHAR(COUNT(*)) FROM RSDS WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'open_hub_destinations', TO_VARCHAR(COUNT(*)) FROM RSBOHDEST WHERE OBJVERS = 'A'\nUNION ALL SELECT 'sap', 'dialog_users', TO_VARCHAR(COUNT(DISTINCT BNAME)) FROM USR02 WHERE USTYP = 'A' AND UFLAG = 0\nUNION ALL SELECT 'sap', 'bg_jobs_30d', TO_VARCHAR(COUNT(*)) FROM TBTCO\n           WHERE SDLSTRTDT >= TO_VARCHAR(ADD_DAYS(CURRENT_DATE, -30), 'YYYYMMDD')\nUNION ALL SELECT * FROM (\n            SELECT TOP 25 'table_top', TABLE_NAME, TO_VARCHAR(ROUND(DISK_SIZE / 1073741824, 2))\n              FROM SYS.M_TABLE_PERSISTENCE_STATISTICS\n             WHERE SCHEMA_NAME = CURRENT_SCHEMA\n             ORDER BY DISK_SIZE DESC);\n\n-- QUERY 2 - BW 7.4+ and BW/4HANA objects\nSELECT CAST('bw' AS NVARCHAR(40)) AS SEC, CAST('adsos' AS NVARCHAR(256)) AS METRIC_NAME, TO_NVARCHAR(COUNT(*)) AS METRIC_VALUE FROM RSOADSO WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'composite_providers', TO_VARCHAR(COUNT(*)) FROM RSOHCPR WHERE OBJVERS = 'A';\n\n-- QUERY 3 - classic objects (BW 7.x only)\nSELECT CAST('bw' AS NVARCHAR(40)) AS SEC, CAST('infocubes' AS NVARCHAR(256)) AS METRIC_NAME, TO_NVARCHAR(COUNT(*)) AS METRIC_VALUE FROM RSDCUBE WHERE OBJVERS = 'A'\nUNION ALL SELECT 'bw', 'classic_dsos', TO_VARCHAR(COUNT(*)) FROM RSDODSO WHERE OBJVERS = 'A';\n", "fabric_discovery_sap_checklist.csv": "section,metric,value,how_to_collect\nplatform,platform,sap_erp,Keep sap_erp for ECC or S/4HANA. Use sap_bw for a BW or BW/4HANA system.\nplatform,product,,\"ECC 6.0 EHPx / S/4HANA 20xx / BW 7.5 / BW/4HANA 20xx (System > Status, or SPAM)\"\nplatform,db,,\"hana, oracle, db2, mssql, maxdb or ase (System > Status > Database)\"\nsize,total_size_gb,,DB02 (or DBACOCKPIT) > Space > Used database size in GB\nsap,tables_in_scope,,Number of SAP tables you expect to extract for analytics\nsap,active_datasources,,RSA6 > count of active DataSources (or SE16N on ROOSOURCE with OBJVERS = A)\nsap,custom_tabl,,SE16N on TADIR: PGMID = R3TR / OBJECT = TABL / OBJ_NAME = Z* and Y* (add both counts)\nsap,custom_ddls,,SE16N on TADIR: OBJECT = DDLS / OBJ_NAME = Z* and Y* (custom CDS views)\nsap,custom_prog,,SE16N on TADIR: OBJECT = PROG / OBJ_NAME = Z* and Y*\nsap,dialog_users,,SUIM > Users by logon date (dialog users / type A / not locked)\nsap,bg_jobs_30d,,SM37 > all jobs in the last 30 days (number of jobs)\nsap,odp_third_party_subscribers,,\"ODQMON > subscriptions: number of non-SAP subscribers (Note 3255746 exposure)\"\nsap,slt_in_use,,LTRC on the SLT system: yes or no\nsap,modules,,\"Modules in scope, separated by semicolons: FI;CO;SD;MM;PP;PM;QM;PS;HCM;WM;EWM;TM\"\nbw,infoproviders,,RSA1 > InfoProvider count (ADSOs + DSOs + InfoCubes + CompositeProviders)\nbw,queries,,RSRT or SE16N on RSZCOMPDIR (OBJVERS = A and DEFTP = REP)\nbw,process_chains,,RSPC > number of process chains\nbw,transformations,,SE16N on RSTRAN (OBJVERS = A)\nworkload,daily_queries,,ST03N > workload overview (BW: query navigation steps per day)\n", "fabric_discovery_sap_erp_hana.sql": "-- =============================================================================\n-- Fabric Migration Assessment Accelerator\n-- Discovery script : SAP ECC 6.0 / SAP S/4HANA running on SAP HANA\n-- Script version   : 2026.11\n-- -----------------------------------------------------------------------------\n-- What it does : One read-only query over the ABAP dictionary (TADIR, USR02,\n--                TBTCO, ROOSOURCE) and HANA monitoring views. No business data.\n-- BEFORE RUNNING: Ask your SAP Basis team. Many SAP HANA licences are runtime\n--                licences that restrict direct SQL access by non-SAP tools. If\n--                direct reads are not allowed, use the transaction checklist\n--                (fabric_discovery_sap_checklist.csv) instead.\n-- How to run   : SAP HANA Database Explorer / HANA Studio / hdbsql, connected\n--                with a read-only user. Replace SAPHANADB with your ABAP schema\n--                (often SAPHANADB, SAPABAP1 or SAPSR3), run, export the grid as CSV.\n-- Other DBs    : On Oracle/Db2/SQL Server, use the same tables in schema SAPSR3\n--                (change TO_VARCHAR to TO_CHAR or CAST, and FROM DUMMY to FROM DUAL).\n-- =============================================================================\nSET SCHEMA SAPHANADB;\n\nSELECT CAST('platform' AS NVARCHAR(40)) AS SEC, CAST('platform' AS NVARCHAR(256)) AS METRIC_NAME, CAST('sap_erp' AS NVARCHAR(1000)) AS METRIC_VALUE FROM DUMMY\nUNION ALL SELECT 'platform', 'script_version', '2026.11' FROM DUMMY\nUNION ALL SELECT 'platform', 'db', 'hana' FROM DUMMY\nUNION ALL SELECT 'platform', 'hana_version', VERSION FROM SYS.M_DATABASE\nUNION ALL SELECT 'size', 'total_size_gb', TO_VARCHAR(ROUND(SUM(DISK_SIZE) / 1073741824, 2))\n            FROM SYS.M_TABLE_PERSISTENCE_STATISTICS WHERE SCHEMA_NAME = CURRENT_SCHEMA\nUNION ALL SELECT 'size', 'memory_size_gb', TO_VARCHAR(ROUND(SUM(MEMORY_SIZE_IN_TOTAL) / 1073741824, 2))\n            FROM SYS.M_CS_TABLES WHERE SCHEMA_NAME = CURRENT_SCHEMA\nUNION ALL SELECT 'sap', 'table_count', TO_VARCHAR(COUNT(*)) FROM SYS.TABLES WHERE SCHEMA_NAME = CURRENT_SCHEMA\nUNION ALL SELECT 'sap', 'custom_' || LOWER(OBJECT), TO_VARCHAR(COUNT(*))\n            FROM TADIR\n           WHERE PGMID = 'R3TR'\n             AND OBJECT IN ('TABL','VIEW','DDLS','PROG','FUGR','CLAS','TRAN','ENHO')\n             AND (OBJ_NAME LIKE 'Z%' OR OBJ_NAME LIKE 'Y%')\n           GROUP BY OBJECT\nUNION ALL SELECT 'sap', 'dialog_users', TO_VARCHAR(COUNT(DISTINCT BNAME)) FROM USR02 WHERE USTYP = 'A' AND UFLAG = 0\nUNION ALL SELECT 'sap', 'bg_jobs_30d', TO_VARCHAR(COUNT(*)) FROM TBTCO\n           WHERE SDLSTRTDT >= TO_VARCHAR(ADD_DAYS(CURRENT_DATE, -30), 'YYYYMMDD')\nUNION ALL SELECT 'sap', 'active_datasources', TO_VARCHAR(COUNT(*)) FROM ROOSOURCE WHERE OBJVERS = 'A'\nUNION ALL SELECT * FROM (\n            SELECT TOP 25 'table_top', TABLE_NAME, TO_VARCHAR(ROUND(DISK_SIZE / 1073741824, 2))\n              FROM SYS.M_TABLE_PERSISTENCE_STATISTICS\n             WHERE SCHEMA_NAME = CURRENT_SCHEMA\n             ORDER BY DISK_SIZE DESC);\n", "fabric_discovery_sqlserver.sql": "/* =============================================================================\n   Fabric Migration Assessment Accelerator\n   Discovery script : Microsoft SQL Server 2012+ / Azure SQL Managed Instance\n   Script version   : 2026.11\n   -----------------------------------------------------------------------------\n   What it does : Reads catalog views and DMVs only. No business data is read and\n                  nothing is written outside tempdb (#temp tables, dropped at end).\n   Permissions  : VIEW SERVER STATE + VIEW ANY DEFINITION (a read-only sysadmin\n                  login also works). Reads msdb, SSISDB and ReportServer if present.\n   How to run   : SSMS or Azure Data Studio -> New Query on the instance -> Execute.\n                  Save the single result grid as CSV (right-click the grid ->\n                  Save Results As...). Import the CSV in the accelerator:\n                  Automate -> Discovery scripts -> Import results.\n   Runtime      : Usually under 2 minutes; grows with the number of objects.\n   Privacy      : Set @include_object_names = 0 to omit the top-25 table names.\n   ============================================================================= */\nSET NOCOUNT ON;\nDECLARE @include_object_names bit = 1;\n\nIF OBJECT_ID('tempdb..#fab') IS NOT NULL DROP TABLE #fab;\nIF OBJECT_ID('tempdb..#db')  IS NOT NULL DROP TABLE #db;\nIF OBJECT_ID('tempdb..#top') IS NOT NULL DROP TABLE #top;\nCREATE TABLE #fab (section varchar(40), metric varchar(256), value nvarchar(4000));\nCREATE TABLE #db  (dbname sysname, metric varchar(128), value float);\nCREATE TABLE #top (dbname sysname, schema_name sysname, table_name sysname, size_gb decimal(18,3), row_count bigint);\n\nDECLARE @major int = CAST(PARSENAME(CONVERT(varchar(32), SERVERPROPERTY('ProductVersion')), 4) AS int);\n\n/* ---- Platform ------------------------------------------------------------ */\nINSERT #fab VALUES ('platform','platform','mssql'), ('platform','script_version','2026.11'), ('platform','product','Microsoft SQL Server');\nINSERT #fab SELECT 'platform','version',        CONVERT(nvarchar(100), SERVERPROPERTY('ProductVersion'));\nINSERT #fab SELECT 'platform','product_level',  CONVERT(nvarchar(100), SERVERPROPERTY('ProductLevel'));\nINSERT #fab SELECT 'platform','edition',        CONVERT(nvarchar(200), SERVERPROPERTY('Edition'));\nINSERT #fab SELECT 'platform','engine_edition', CONVERT(nvarchar(20),  SERVERPROPERTY('EngineEdition'));\nINSERT #fab SELECT 'platform','collation',      CONVERT(nvarchar(200), SERVERPROPERTY('Collation'));\nINSERT #fab SELECT 'platform','is_clustered',   CONVERT(nvarchar(10),  SERVERPROPERTY('IsClustered'));\nINSERT #fab SELECT 'platform','is_hadr_enabled',CONVERT(nvarchar(10),  SERVERPROPERTY('IsHadrEnabled'));\nBEGIN TRY\n  INSERT #fab SELECT 'platform','cpu_count',   CONVERT(nvarchar(20), cpu_count) FROM sys.dm_os_sys_info;\n  INSERT #fab SELECT 'platform','memory_gb',   CONVERT(nvarchar(30), CAST(physical_memory_kb / 1048576.0 AS decimal(18,1))) FROM sys.dm_os_sys_info;\n  INSERT #fab SELECT 'platform','uptime_days', CONVERT(nvarchar(30), CAST(DATEDIFF(minute, sqlserver_start_time, GETDATE()) / 1440.0 AS decimal(18,1))) FROM sys.dm_os_sys_info;\nEND TRY BEGIN CATCH INSERT #fab VALUES ('error','os_info', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\nINSERT #fab SELECT 'platform','min_compat_level', CONVERT(nvarchar(10), MIN(compatibility_level)) FROM sys.databases WHERE database_id > 4;\n\n/* ---- Server-level inventory, workload, CDC, security ---------------------- */\nINSERT #fab SELECT 'inventory','database_count', CONVERT(nvarchar(20), COUNT(*)) FROM sys.databases\n  WHERE database_id > 4 AND state_desc = 'ONLINE' AND name NOT IN ('SSISDB','distribution') AND name NOT LIKE 'ReportServer%';\nINSERT #fab SELECT 'size','allocated_size_gb', CONVERT(nvarchar(30), CAST(SUM(CAST(size AS bigint)) * 8 / 1048576.0 AS decimal(18,2)))\n  FROM sys.master_files WHERE type = 0 AND database_id > 4;\nINSERT #fab SELECT 'inventory','linked_server_count', CONVERT(nvarchar(20), COUNT(*)) FROM sys.servers WHERE is_linked = 1;\nINSERT #fab SELECT 'workload','login_count', CONVERT(nvarchar(20), COUNT(*)) FROM sys.server_principals\n  WHERE type IN ('S','U','G','E','X') AND is_disabled = 0 AND name NOT LIKE '##%' AND name NOT LIKE 'NT SERVICE\\%' AND name NOT LIKE 'NT AUTHORITY\\%';\nINSERT #fab SELECT 'workload','user_sessions_now', CONVERT(nvarchar(20), COUNT(*)) FROM sys.dm_exec_sessions WHERE is_user_process = 1;\nINSERT #fab SELECT 'cdc','cdc_enabled_dbs', CONVERT(nvarchar(20), COUNT(*)) FROM sys.databases WHERE is_cdc_enabled = 1;\nINSERT #fab SELECT 'security','tde_enabled_dbs', CONVERT(nvarchar(20), COUNT(*)) FROM sys.databases WHERE is_encrypted = 1 AND database_id > 4;\nBEGIN TRY\n  INSERT #fab SELECT 'cdc','change_tracking_dbs', CONVERT(nvarchar(20), COUNT(*)) FROM sys.change_tracking_databases;\nEND TRY BEGIN CATCH INSERT #fab VALUES ('error','change_tracking', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\nBEGIN TRY\n  DECLARE @updays float = (SELECT DATEDIFF(minute, sqlserver_start_time, GETDATE()) / 1440.0 FROM sys.dm_os_sys_info);\n  INSERT #fab SELECT 'workload','daily_batches', CONVERT(nvarchar(30), CAST(cntr_value / NULLIF(@updays, 0) AS bigint))\n    FROM sys.dm_os_performance_counters WHERE counter_name LIKE 'Batch Requests/sec%' AND object_name LIKE '%SQL Statistics%';\nEND TRY BEGIN CATCH INSERT #fab VALUES ('error','daily_batches', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\n/* Client applications connected right now (snapshot) - helps detect ETL/BI tools */\nINSERT #fab SELECT TOP 25 'client_app', LEFT(ISNULL(NULLIF(program_name, ''), '(unknown)'), 200), CONVERT(nvarchar(20), COUNT(*))\n  FROM sys.dm_exec_sessions WHERE is_user_process = 1 GROUP BY program_name ORDER BY COUNT(*) DESC;\n\n/* ---- SQL Agent, SSIS, SSRS ------------------------------------------------ */\nBEGIN TRY\n  INSERT #fab SELECT 'etl','agent_jobs', CONVERT(nvarchar(20), COUNT(*)) FROM msdb.dbo.sysjobs WHERE enabled = 1;\n  INSERT #fab SELECT 'etl','agent_job_steps_ssis', CONVERT(nvarchar(20), COUNT(*)) FROM msdb.dbo.sysjobsteps WHERE subsystem = 'SSIS';\n  INSERT #fab SELECT 'etl','msdb_ssis_packages', CONVERT(nvarchar(20), COUNT(*)) FROM msdb.dbo.sysssispackages WHERE packagetype = 5;\nEND TRY BEGIN CATCH INSERT #fab VALUES ('error','msdb', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\nIF DB_ID('SSISDB') IS NOT NULL\nBEGIN\n  BEGIN TRY\n    EXEC (N'INSERT #fab SELECT ''etl'',''ssisdb_packages'', CONVERT(nvarchar(20), COUNT(*)) FROM SSISDB.catalog.packages;\n            INSERT #fab SELECT ''etl'',''ssisdb_projects'', CONVERT(nvarchar(20), COUNT(*)) FROM SSISDB.catalog.projects;\n            INSERT #fab SELECT ''etl'',''ssis_executions_30d'', CONVERT(nvarchar(20), COUNT(*)) FROM SSISDB.catalog.executions WHERE start_time > DATEADD(day, -30, SYSDATETIMEOFFSET());');\n  END TRY BEGIN CATCH INSERT #fab VALUES ('error','ssisdb', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\nEND;\nDECLARE @rs sysname = (SELECT TOP 1 name FROM sys.databases WHERE name LIKE 'ReportServer%' AND name NOT LIKE '%TempDB' ORDER BY name);\nIF @rs IS NOT NULL\nBEGIN\n  BEGIN TRY\n    DECLARE @rsql nvarchar(max) =\n      N'INSERT #fab SELECT ''bi'',''ssrs_reports'', CONVERT(nvarchar(20), COUNT(*)) FROM ' + QUOTENAME(@rs) + N'.dbo.Catalog WHERE Type = 2;\n        INSERT #fab SELECT ''bi'',''ssrs_shared_datasets'', CONVERT(nvarchar(20), COUNT(*)) FROM ' + QUOTENAME(@rs) + N'.dbo.Catalog WHERE Type = 8;\n        INSERT #fab SELECT ''bi'',''ssrs_reports_used_recent'', CONVERT(nvarchar(20), COUNT(DISTINCT ReportID)) FROM ' + QUOTENAME(@rs) + N'.dbo.ExecutionLogStorage WHERE TimeStart > DATEADD(day, -90, GETDATE());';\n    EXEC sp_executesql @rsql;\n  END TRY BEGIN CATCH INSERT #fab VALUES ('error','ssrs', LEFT(ERROR_MESSAGE(), 400)); END CATCH;\nEND;\n\n/* ---- Per-database scan ---------------------------------------------------- */\nDECLARE @db sysname, @sql nvarchar(max);\nDECLARE dbc CURSOR LOCAL FAST_FORWARD FOR\n  SELECT name FROM sys.databases\n  WHERE database_id > 4 AND state_desc = 'ONLINE' AND HAS_DBACCESS(name) = 1\n    AND name NOT IN ('SSISDB','distribution') AND name NOT LIKE 'ReportServer%';\nOPEN dbc;\nFETCH NEXT FROM dbc INTO @db;\nWHILE @@FETCH_STATUS = 0\nBEGIN\n  SET @sql = N'USE ' + QUOTENAME(@db) + N';\nINSERT #db SELECT DB_NAME(), ''table_count'', COUNT(*) FROM sys.tables WHERE is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''view_count'', COUNT(*) FROM sys.views WHERE is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''proc_count'', COUNT(*) FROM sys.procedures WHERE is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''function_count'', COUNT(*) FROM sys.objects WHERE is_ms_shipped = 0 AND type IN (''FN'',''IF'',''TF'',''FS'',''FT'');\nINSERT #db SELECT DB_NAME(), ''trigger_count'', COUNT(*) FROM sys.triggers WHERE is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''sequence_count'', COUNT(*) FROM sys.sequences;\nINSERT #db SELECT DB_NAME(), ''synonym_count'', COUNT(*) FROM sys.synonyms;\nINSERT #db SELECT DB_NAME(), ''clr_assembly_count'', COUNT(*) FROM sys.assemblies WHERE is_user_defined = 1;\nINSERT #db SELECT DB_NAME(), ''schema_count'', COUNT(*) FROM sys.schemas WHERE schema_id BETWEEN 5 AND 16383;\nINSERT #db SELECT DB_NAME(), ''db_user_count'', COUNT(*) FROM sys.database_principals WHERE type IN (''S'',''U'',''G'',''E'',''X'') AND principal_id > 4;\nINSERT #db SELECT DB_NAME(), ''partitioned_table_count'', COUNT(DISTINCT p.object_id) FROM sys.partitions p JOIN sys.tables t ON t.object_id = p.object_id WHERE t.is_ms_shipped = 0 AND p.partition_number > 1;\nINSERT #db SELECT DB_NAME(), ''indexed_view_count'', COUNT(*) FROM sys.indexes i JOIN sys.views v ON v.object_id = i.object_id WHERE i.index_id = 1;\nINSERT #db SELECT DB_NAME(), ''columnstore_index_count'', COUNT(*) FROM sys.indexes WHERE type IN (5,6);\nINSERT #db SELECT DB_NAME(), ''service_queue_count'', COUNT(*) FROM sys.service_queues WHERE is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''fulltext_index_count'', COUNT(*) FROM sys.fulltext_indexes;\nINSERT #db SELECT DB_NAME(), ''code_lines'', ISNULL(SUM(CAST(LEN(m.definition) - LEN(REPLACE(m.definition, NCHAR(10), N'''')) + 1 AS bigint)), 0)\n  FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id WHERE o.is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''cursor_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND m.definition LIKE N''%DECLARE%CURSOR%'';\nINSERT #db SELECT DB_NAME(), ''dynamic_sql_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND (m.definition LIKE N''%sp[_]executesql%'' OR m.definition LIKE N''%EXEC(%'' OR m.definition LIKE N''%EXEC (%'' OR m.definition LIKE N''%EXECUTE(%'');\nINSERT #db SELECT DB_NAME(), ''temp_table_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND (m.definition LIKE N''%INTO #%'' OR m.definition LIKE N''%TABLE #%'');\nINSERT #db SELECT DB_NAME(), ''merge_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND m.definition LIKE N''%MERGE%USING%'';\nINSERT #db SELECT DB_NAME(), ''xml_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND (m.definition LIKE N''%FOR XML%'' OR m.definition LIKE N''%OPENXML%'' OR m.definition LIKE N''%.nodes(%'');\nINSERT #db SELECT DB_NAME(), ''remote_query_objects'', COUNT(*) FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id\n  WHERE o.is_ms_shipped = 0 AND (m.definition LIKE N''%OPENQUERY%'' OR m.definition LIKE N''%OPENROWSET%'' OR m.definition LIKE N''%OPENDATASOURCE%'');\nINSERT #db SELECT DB_NAME(), ''cross_db_objects'', COUNT(DISTINCT referencing_id) FROM sys.sql_expression_dependencies\n  WHERE referenced_database_name IS NOT NULL AND referenced_database_name <> DB_NAME();\nINSERT #db SELECT DB_NAME(), ''remote_server_objects'', COUNT(DISTINCT referencing_id) FROM sys.sql_expression_dependencies WHERE referenced_server_name IS NOT NULL;\nINSERT #db SELECT DB_NAME(), ''columns_total'', COUNT(*) FROM sys.columns c JOIN sys.tables t ON t.object_id = c.object_id WHERE t.is_ms_shipped = 0;\nINSERT #db SELECT DB_NAME(), ''col_'' + CASE WHEN ut.is_assembly_type = 1 THEN ut.name ELSE bt.name END, COUNT(*)\n  FROM sys.columns c\n  JOIN sys.tables t ON t.object_id = c.object_id\n  JOIN sys.types ut ON ut.user_type_id = c.user_type_id\n  LEFT JOIN sys.types bt ON bt.user_type_id = c.system_type_id\n  WHERE t.is_ms_shipped = 0\n    AND (ut.is_assembly_type = 1 OR bt.name IN (''nvarchar'',''nchar'',''ntext'',''text'',''image'',''datetime'',''smalldatetime'',''datetimeoffset'',''money'',''smallmoney'',''tinyint'',''xml'',''sql_variant'',''timestamp''))\n  GROUP BY CASE WHEN ut.is_assembly_type = 1 THEN ut.name ELSE bt.name END;\nINSERT #db SELECT DB_NAME(), ''used_size_gb'', ISNULL(SUM(reserved_page_count) * 8.0 / 1048576, 0) FROM sys.dm_db_partition_stats;\nINSERT #db SELECT DB_NAME(), ''total_rows'', ISNULL(SUM(CASE WHEN index_id IN (0,1) THEN row_count ELSE 0 END), 0) FROM sys.dm_db_partition_stats;\nINSERT #top SELECT TOP 25 DB_NAME(), s.name, t.name, SUM(ps.reserved_page_count) * 8.0 / 1048576, SUM(CASE WHEN ps.index_id IN (0,1) THEN ps.row_count ELSE 0 END)\n  FROM sys.dm_db_partition_stats ps\n  JOIN sys.tables t ON t.object_id = ps.object_id\n  JOIN sys.schemas s ON s.schema_id = t.schema_id\n  WHERE t.is_ms_shipped = 0\n  GROUP BY s.name, t.name\n  ORDER BY SUM(ps.reserved_page_count) DESC;';\n  BEGIN TRY EXEC sp_executesql @sql; END TRY\n  BEGIN CATCH INSERT #fab VALUES ('error', 'db:' + @db, LEFT(ERROR_MESSAGE(), 400)); END CATCH;\n\n  IF @major >= 13   /* SQL Server 2016+ catalog features */\n  BEGIN\n    SET @sql = N'USE ' + QUOTENAME(@db) + N';\nINSERT #db SELECT DB_NAME(), ''rls_policy_count'', COUNT(*) FROM sys.security_policies;\nINSERT #db SELECT DB_NAME(), ''masked_column_count'', COUNT(*) FROM sys.masked_columns;\nINSERT #db SELECT DB_NAME(), ''encrypted_column_count'', COUNT(*) FROM sys.columns WHERE encryption_type IS NOT NULL;\nINSERT #db SELECT DB_NAME(), ''temporal_table_count'', COUNT(*) FROM sys.tables WHERE temporal_type = 2;';\n    BEGIN TRY EXEC sp_executesql @sql; END TRY\n    BEGIN CATCH INSERT #fab VALUES ('error', 'db2016:' + @db, LEFT(ERROR_MESSAGE(), 400)); END CATCH;\n  END;\n  IF @major >= 12   /* SQL Server 2014+ */\n  BEGIN\n    SET @sql = N'USE ' + QUOTENAME(@db) + N';\nINSERT #db SELECT DB_NAME(), ''memory_optimized_table_count'', COUNT(*) FROM sys.tables WHERE is_memory_optimized = 1;';\n    BEGIN TRY EXEC sp_executesql @sql; END TRY\n    BEGIN CATCH INSERT #fab VALUES ('error', 'db2014:' + @db, LEFT(ERROR_MESSAGE(), 400)); END CATCH;\n  END;\n  FETCH NEXT FROM dbc INTO @db;\nEND;\nCLOSE dbc;\nDEALLOCATE dbc;\n\n/* ---- Aggregate ------------------------------------------------------------- */\nINSERT #fab\nSELECT CASE\n         WHEN metric IN ('code_lines','cursor_objects','dynamic_sql_objects','temp_table_objects','merge_objects','xml_objects',\n                         'remote_query_objects','cross_db_objects','remote_server_objects') THEN 'code'\n         WHEN metric LIKE 'col[_]%' OR metric = 'columns_total' THEN 'types'\n         WHEN metric IN ('used_size_gb','total_rows') THEN 'size'\n         WHEN metric IN ('rls_policy_count','masked_column_count','encrypted_column_count') THEN 'security'\n         WHEN metric = 'db_user_count' THEN 'workload'\n         ELSE 'inventory' END,\n       metric,\n       CONVERT(nvarchar(50), CAST(SUM(value) AS decimal(38,2)))\nFROM #db GROUP BY metric;\nINSERT #fab SELECT 'types','unsupported_type_columns', CONVERT(nvarchar(30), CAST(ISNULL(SUM(value), 0) AS bigint)) FROM #db WHERE metric LIKE 'col[_]%';\nINSERT #fab SELECT 'size','largest_table_gb', CONVERT(nvarchar(30), CAST(ISNULL(MAX(size_gb), 0) AS decimal(18,2))) FROM #top;\nIF @include_object_names = 1\n  INSERT #fab SELECT TOP 25 'table_top', dbname + '.' + schema_name + '.' + table_name,\n         CONVERT(nvarchar(30), CAST(size_gb AS decimal(18,2))) + '|' + CONVERT(nvarchar(30), row_count)\n  FROM #top ORDER BY size_gb DESC;\n\n/* ---- Result: save this grid as CSV ----------------------------------------- */\nSELECT section, metric, value FROM #fab\nORDER BY CASE section WHEN 'platform' THEN 1 WHEN 'size' THEN 2 WHEN 'inventory' THEN 3 WHEN 'code' THEN 4 WHEN 'types' THEN 5\n                      WHEN 'workload' THEN 6 WHEN 'etl' THEN 7 WHEN 'bi' THEN 8 WHEN 'cdc' THEN 9 WHEN 'security' THEN 10\n                      WHEN 'client_app' THEN 11 WHEN 'table_top' THEN 12 ELSE 99 END, metric;\n\nDROP TABLE #fab; DROP TABLE #db; DROP TABLE #top;\n", "fabric_discovery_teradata.bteq": ".LOGON tdpid/username,password\n.SET WIDTH 2000\n.SET TITLEDASHES OFF\n\n/* =============================================================================\n   Fabric Migration Assessment Accelerator\n   Discovery script : Teradata Database 15.10+ / Teradata Vantage (on-prem, IntelliFlex, VantageCloud)\n   Script version   : 2026.11\n   -----------------------------------------------------------------------------\n   What it does : Reads DBC dictionary views and the DBQL query log only.\n                  Creates two VOLATILE tables in your own session (gone at logoff).\n                  No business data is read.\n   Permissions  : SELECT on DBC.TablesV, ColumnsV, DatabasesV, DiskSpaceV,\n                  TableSizeV, IndexConstraintsV, DBCInfoV and DBC.QryLogV (workload).\n   How to run   : 1) Edit the .LOGON line above.  2) bteq < fabric_discovery_teradata.bteq\n                  Teradata Studio / SQL Assistant: skip the dot-commands, run the\n                  statements, then export the final result grid as CSV.\n   Output       : fabric_discovery_teradata.csv\n   Note         : If DBQL history is archived with PDCR, replace DBC.QryLogV with\n                  PDCRINFO.DBQLogTbl_Hst in the workload section.\n   ============================================================================= */\nCREATE VOLATILE TABLE fab_sysdb (dbname VARCHAR(128) CHARACTER SET UNICODE) ON COMMIT PRESERVE ROWS;\n\nINSERT INTO fab_sysdb\nSELECT DatabaseName FROM DBC.DatabasesV\nWHERE DatabaseName IN ('DBC','SYSLIB','SYSUDTLIB','SYSSPATIAL','SYSBAR','SYSJDBC','SYSXML','TD_SYSXML','TD_SYSFNLIB',\n                       'TD_SYSGPL','TD_SERVER_DB','TDSTATS','TDQCD','TDMAPS','TD_ANALYTICS_DB','TDWM','LockLogShredder',\n                       'SystemFe','Sys_Calendar','dbcmngr','SQLJ','External_AP','Crashdumps','PUBLIC','Default','All',\n                       'EXTUSER','SysAdmin','TDPUSER','console','SYSUIF','TD_METRIC_SVC','TD_SYSINTERNAL','viewpoint',\n                       'DATAMOVER','TD_DATASHARING_REPO','TD_OFSMETA','TDBCMgmt')\n   OR DatabaseName LIKE 'PDCR%' OR DatabaseName LIKE 'TDaaS%' OR DatabaseName LIKE 'TD_SYS%';\n\nCREATE VOLATILE TABLE fab_disc (section VARCHAR(40), metric VARCHAR(256), val VARCHAR(1000)) ON COMMIT PRESERVE ROWS;\n\n/* ---- Platform ---------------------------------------------------------------- */\nINSERT INTO fab_disc VALUES ('platform', 'platform', 'teradata');\nINSERT INTO fab_disc VALUES ('platform', 'script_version', '2026.11');\nINSERT INTO fab_disc SELECT 'platform', 'version', TRIM(InfoData) FROM DBC.DBCInfoV WHERE InfoKey = 'VERSION';\nINSERT INTO fab_disc SELECT 'platform', 'release', TRIM(InfoData) FROM DBC.DBCInfoV WHERE InfoKey = 'RELEASE';\nINSERT INTO fab_disc SELECT 'platform', 'amp_count', TRIM(CAST(HASHAMP() + 1 AS VARCHAR(20)));\n\n/* ---- Size ---------------------------------------------------------------------- */\nINSERT INTO fab_disc\nSELECT 'size', 'total_size_gb', TRIM(CAST(CAST(SUM(CAST(CurrentPerm AS FLOAT)) / 1073741824 AS DECIMAL(18,2)) AS VARCHAR(30)))\nFROM DBC.DiskSpaceV WHERE DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc\nSELECT 'size', 'max_perm_gb', TRIM(CAST(CAST(SUM(CAST(MaxPerm AS FLOAT)) / 1073741824 AS DECIMAL(18,2)) AS VARCHAR(30)))\nFROM DBC.DiskSpaceV WHERE DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc\nSELECT 'size', 'largest_table_gb', TRIM(CAST(CAST(MAX(s) / 1073741824 AS DECIMAL(18,2)) AS VARCHAR(30)))\nFROM (SELECT DatabaseName, TableName, SUM(CAST(CurrentPerm AS FLOAT)) AS s\n      FROM DBC.TableSizeV WHERE DatabaseName NOT IN (SELECT dbname FROM fab_sysdb)\n      GROUP BY 1, 2) t;\n\n/* ---- Inventory ------------------------------------------------------------------- */\nINSERT INTO fab_disc\nSELECT 'inventory',\n       CASE TableKind\n         WHEN 'T' THEN 'table_count'        WHEN 'O' THEN 'nopi_table_count'\n         WHEN 'V' THEN 'view_count'         WHEN 'P' THEN 'proc_count'\n         WHEN 'E' THEN 'external_proc_count' WHEN 'M' THEN 'macro_count'\n         WHEN 'F' THEN 'function_count'     WHEN 'R' THEN 'table_function_count'\n         WHEN 'A' THEN 'aggregate_function_count' WHEN 'G' THEN 'trigger_count'\n         WHEN 'I' THEN 'join_index_count'   WHEN 'N' THEN 'hash_index_count'\n         WHEN 'Q' THEN 'queue_table_count'  WHEN 'U' THEN 'udt_count'\n         ELSE 'kind_' || TRIM(TableKind) END,\n       TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV\nWHERE DatabaseName NOT IN (SELECT dbname FROM fab_sysdb)\nGROUP BY TableKind;\n\nINSERT INTO fab_disc SELECT 'inventory', 'database_count', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.DatabasesV WHERE DBKind = 'D' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'workload', 'user_count', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.DatabasesV WHERE DBKind = 'U' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'inventory', 'ppi_table_count', TRIM(CAST(COUNT(DISTINCT TRIM(DatabaseName) || '.' || TRIM(TableName)) AS VARCHAR(20)))\nFROM DBC.IndexConstraintsV WHERE ConstraintType = 'Q' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\n/* ---- Code volume and feature usage (RequestText holds up to 12,500 chars per object) ---- */\nINSERT INTO fab_disc SELECT 'code', 'proc_macro_chars', TRIM(CAST(SUM(CAST(CHARACTER_LENGTH(RequestText) AS BIGINT)) AS VARCHAR(30)))\nFROM DBC.TablesV WHERE TableKind IN ('P','M','G','F') AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'view_chars', TRIM(CAST(SUM(CAST(CHARACTER_LENGTH(RequestText) AS BIGINT)) AS VARCHAR(30)))\nFROM DBC.TablesV WHERE TableKind = 'V' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'qualify_objects', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind IN ('V','M','P') AND UPPER(RequestText) LIKE '%QUALIFY%' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'recursive_objects', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind IN ('V','M','P') AND UPPER(RequestText) LIKE '%RECURSIVE%' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'volatile_table_objects', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind IN ('M','P') AND UPPER(RequestText) LIKE '%VOLATILE TABLE%' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'cursor_objects', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind = 'P' AND UPPER(RequestText) LIKE '%CURSOR%' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'dynamic_sql_objects', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind = 'P' AND (UPPER(RequestText) LIKE '%SYSEXECSQL%' OR UPPER(RequestText) LIKE '%EXECUTE IMMEDIATE%')\n  AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\nINSERT INTO fab_disc SELECT 'code', 'set_table_explicit', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.TablesV WHERE TableKind = 'T' AND UPPER(RequestText) LIKE '%CREATE SET TABLE%' AND DatabaseName NOT IN (SELECT dbname FROM fab_sysdb);\n\n/* ---- Column data types --------------------------------------------------------------- */\nINSERT INTO fab_disc\nSELECT 'types',\n       CASE\n         WHEN c.ColumnType IN ('PD','PS','PT','PZ','PM') THEN 'period_columns'\n         WHEN c.ColumnType = 'JN' THEN 'json_columns'\n         WHEN c.ColumnType = 'XM' THEN 'xml_columns'\n         WHEN c.ColumnType IN ('BO','CO') THEN 'lob_columns'\n         WHEN c.ColumnType = 'UT' AND UPPER(c.ColumnUDTName) LIKE '%ST_GEOMETRY%' THEN 'spatial_columns'\n         WHEN c.ColumnType = 'UT' THEN 'udt_columns'\n         WHEN c.ColumnType IN ('A1','AN') THEN 'array_columns'\n         WHEN c.ColumnType IN ('CF','CV') AND c.UpperCaseFlag = 'N' THEN 'not_casespecific_columns'\n         WHEN c.ColumnType IN ('DY','DH','DM','DS','HR','HM','HS','MI','MS','MO','SC','YR','YM') THEN 'interval_columns'\n         ELSE 'other_columns' END,\n       TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.ColumnsV c\nINNER JOIN DBC.TablesV t ON t.DatabaseName = c.DatabaseName AND t.TableName = c.TableName AND t.TableKind IN ('T','O')\nWHERE c.DatabaseName NOT IN (SELECT dbname FROM fab_sysdb)\nGROUP BY 2;\n\n/* ---- Workload from DBQL (last 30 days) ----------------------------------------------- */\nINSERT INTO fab_disc SELECT 'workload', 'queries_30d', TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY;\n\nINSERT INTO fab_disc SELECT 'workload', 'dbql_days', TRIM(CAST(COUNT(DISTINCT CAST(StartTime AS DATE)) AS VARCHAR(20)))\nFROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY;\n\nINSERT INTO fab_disc SELECT 'workload', 'active_users_30d', TRIM(CAST(COUNT(DISTINCT UserName) AS VARCHAR(20)))\nFROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY;\n\nINSERT INTO fab_disc SELECT 'workload', 'peak_hour_queries', TRIM(CAST(MAX(cnt) AS VARCHAR(20)))\nFROM (SELECT CAST(StartTime AS DATE) AS d, EXTRACT(HOUR FROM StartTime) AS h, COUNT(*) AS cnt\n      FROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY GROUP BY 1, 2) t;\n\nINSERT INTO fab_disc SELECT 'workload', 'cpu_seconds_30d', TRIM(CAST(CAST(SUM(AMPCPUTime) AS DECIMAL(18,0)) AS VARCHAR(30)))\nFROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY;\n\n/* Client tools by query count (BTEQ, TPT, Informatica, Tableau, MicroStrategy ...) */\nINSERT INTO fab_disc\nSELECT 'client_app', TRIM(COALESCE(AppID, '(unknown)')), TRIM(CAST(COUNT(*) AS VARCHAR(20)))\nFROM DBC.QryLogV WHERE StartTime > CURRENT_TIMESTAMP - INTERVAL '30' DAY\nGROUP BY AppID\nQUALIFY ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC) <= 30;\n\n/* ---- Largest tables (wave planning). Delete this block to omit table names. ---------- */\nINSERT INTO fab_disc\nSELECT 'table_top', TRIM(DatabaseName) || '.' || TRIM(TableName),\n       TRIM(CAST(CAST(SUM(CAST(CurrentPerm AS FLOAT)) / 1073741824 AS DECIMAL(18,2)) AS VARCHAR(30)))\nFROM DBC.TableSizeV WHERE DatabaseName NOT IN (SELECT dbname FROM fab_sysdb)\nGROUP BY DatabaseName, TableName\nQUALIFY ROW_NUMBER() OVER (ORDER BY SUM(CAST(CurrentPerm AS FLOAT)) DESC) <= 25;\n\n/* ---- Export -------------------------------------------------------------------------- */\n.EXPORT REPORT FILE = fabric_discovery_teradata.csv\nSELECT TRIM(section) || ',' || TRIM(metric) || ',' || TRIM(val) (TITLE 'section,metric,value')\nFROM fab_disc ORDER BY section, metric;\n.EXPORT RESET\n.LOGOFF\n.QUIT\n"};

  function archSvg(R) {
    const A = R.arch; const sys = R.systems;
    const W = 1180; const srcH = 50; const gapY = 10; const y0 = 34;
    const ingestKeys = []; sys.forEach((x) => x.pattern.items.forEach((i) => { if (ingestKeys.indexOf(i) < 0) ingestKeys.push(i); }));
    if (A.rt) ingestKeys.push('Eventstream (real-time)');
    // columns: x position and width
    const X = { src: 16, ing: 254, lake: 512, serve: 794, cons: 1000 }; const SW = 212; const IW = 232; const LW = 254; const VW = 182; const CW = 164;
    const box = (x, y, w, h, title, sub, strong, accent) => '<g><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="7" fill="' + (strong ? 'var(--accent-soft)' : 'var(--surface)') + '" stroke="' + (accent || 'var(--line-strong)') + '" stroke-width="' + (accent ? 1.6 : 1) + '"/>' +
      '<text x="' + (x + 10) + '" y="' + (y + 20) + '" class="t-strong" style="font-size:12px">' + esc(title) + '</text>' + (sub ? '<text x="' + (x + 10) + '" y="' + (y + 36) + '" style="font-size:10.5px">' + esc(sub.length > 40 ? sub.slice(0, 39) + '…' : sub) + '</text>' : '') + '</g>';
    const head = (x, t) => '<text x="' + x + '" y="20" class="t-muted" style="font-size:11px;letter-spacing:.06em">' + esc(t.toUpperCase()) + '</text>';
    const arrow = (x1, y1, x2, y2) => '<path d="M' + x1 + ',' + y1 + ' C' + ((x1 + x2) / 2) + ',' + y1 + ' ' + ((x1 + x2) / 2) + ',' + y2 + ' ' + x2 + ',' + y2 + '" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ah)"/>';
    const lh = 54; const lgap = 24; const lakeY = y0; const lakeH = 16 + 3 * lh + 2 * lgap + 16; const lw = LW - 30;
    const serves = [['Semantic models', 'Direct Lake, shared measures'], ['SQL analytics endpoint', 'Ad-hoc T-SQL']];
    if (A.rt) serves.push(['Eventhouse', 'Real-time KQL']);
    const cons = [['Power BI apps', 'Reports & dashboards'], ['Paginated reports', 'Operational reporting'], ['Excel', 'Connected to models']];
    if (A.ai) cons.push(['Copilot & data agents', 'Natural-language Q&A']);
    if (A.ds) cons.push(['Notebooks & ML', 'Data science']);
    const bottom = Math.max(y0 + Math.max(sys.length, ingestKeys.length, 1) * (srcH + gapY) - gapY, lakeY + lakeH, y0 + 10 + serves.length * 66 - 10, y0 + cons.length * 60 - 8);
    const gy = bottom + 26; const Hh = gy + 64;
    let s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="' + W + '" role="img" aria-label="Target architecture diagram">' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>';
    s += head(X.src, 'Sources') + head(X.ing, 'Ingestion') + head(X.lake, 'OneLake · medallion') + head(X.serve, 'Serve') + head(X.cons, 'Consume');
    const srcY = {}; sys.forEach((x, i) => { const y = y0 + i * (srcH + gapY); srcY[x.sys.id] = y + srcH / 2; s += box(X.src, y, SW, srcH, x.name, x.f.p.short + ' · ' + H.fnum(x.f.tb, 1) + ' TB'); });
    const ingY = {}; ingestKeys.forEach((k, i) => { const y = y0 + i * (srcH + gapY); ingY[k] = y + srcH / 2; const users = (A.ingest[k] || []).length; s += box(X.ing, y, IW, srcH, k, users ? users + ' ' + H.plural(users, 'system') : (k.indexOf('Event') === 0 ? 'Streaming sources' : '')); });
    sys.forEach((x) => { const tgt = x.pattern.items.filter((i) => i.indexOf('gateway') < 0)[0] || x.pattern.items[0]; if (tgt && ingY[tgt] != null) s += arrow(X.src + SW, srcY[x.sys.id], X.ing - 4, ingY[tgt]); });
    s += '<rect x="' + X.lake + '" y="' + lakeY + '" width="' + LW + '" height="' + lakeH + '" rx="10" fill="none" stroke="var(--accent)" stroke-dasharray="4 3"/>';
    const layers = [['Bronze · Lakehouse', 'Raw and mirrored data, shortcuts'], ['Silver · Lakehouse', 'Conformed, cleansed Delta tables'], ['Gold · ' + A.gold, A.gold === 'Warehouse' ? 'Dimensional models in T-SQL' : 'Dimensional models in Delta']];
    const lyY = layers.map((l, i) => lakeY + 16 + i * (lh + lgap));
    layers.forEach((l, i) => { s += box(X.lake + 15, lyY[i], lw, lh, l[0], l[1], i === 2); });
    ingestKeys.forEach((k) => { if (k.indexOf('gateway') >= 0) return; s += arrow(X.ing + IW, ingY[k], X.lake + 13, lyY[0] + lh / 2); });
    s += arrow(X.lake + 15 + lw / 2, lyY[0] + lh, X.lake + 15 + lw / 2, lyY[1] - 2) + arrow(X.lake + 15 + lw / 2, lyY[1] + lh, X.lake + 15 + lw / 2, lyY[2] - 2);
    serves.forEach((sv, i) => { const y = y0 + 10 + i * 66; s += box(X.serve, y, VW, 54, sv[0], sv[1]); s += arrow(X.lake + 15 + lw, lyY[2] + lh / 2, X.serve - 4, y + 27); });
    cons.forEach((cv, i) => { const y = y0 + i * 60; s += box(X.cons, y, CW, 52, cv[0], cv[1]); });
    s += arrow(X.serve + VW, y0 + 37, X.cons - 4, y0 + 26);
    s += '<rect x="16" y="' + gy + '" width="' + (W - 32) + '" height="56" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>' +
      '<text x="30" y="' + (gy + 22) + '" class="t-strong" style="font-size:12px">Governance & operations</text>' +
      '<text x="30" y="' + (gy + 40) + '" style="font-size:11px">' + esc([A.purview ? 'Microsoft Purview catalog & lineage' : 'Purview (recommended)', 'OneLake security & RLS', A.domains.length + ' domains · ' + A.workspaces + ' workspaces', 'Git integration & deployment pipelines', 'Capacity Metrics & workspace monitoring', A.network === 'public' ? 'Entra ID conditional access' : 'Private links & outbound access protection'].join('   ·   ')) + '</text>';
    return '<div class="chart">' + s + '</svg></div>';

      A.domains.map((d) => '<tr><td><b>' + esc(d) + '</b></td><td>' + esc(d) + ' data · ' + esc(d) + ' reporting</td><td>Silver/Gold ' + (A.gold === 'Warehouse' ? 'warehouse' : 'lakehouse') + ', semantic models, reports</td><td>' + A.envNames.join(' → ') + '</td></tr>').join('') + '</tbody></table></div>' +

  /* ============ Roadmap ============ */
  function gantt(P) {
    const rows = P.rows; const W = 1120; const L = 330; const top = 30; const rh = 28;
    const maxW = Math.max(P.weeks, P.deadline ? P.deadline.months * 4.33 : 0, P.target ? P.target * 4.33 : 0) + 2;
    const hgt = top + rows.length * rh + 30; const sx = (w) => L + (W - L - 20) * w / maxW;
    const col = { foundation: C.s1, pilot: C.s2, wave: C.s3, cutover: C.s4, decom: C.s5 };
    let s = '<svg viewBox="0 0 ' + W + ' ' + hgt + '" width="' + W + '" role="img" aria-label="Roadmap Gantt chart">';
    const step = maxW > 80 ? 13 : maxW > 40 ? 8.66 : 4.33;
    s += '<g class="grid">';
    for (let w = 0; w <= maxW; w += step) s += '<line x1="' + sx(w) + '" x2="' + sx(w) + '" y1="' + (top - 6) + '" y2="' + (hgt - 22) + '"/>';
    s += '</g>';
    for (let w = 0; w <= maxW; w += step) s += '<text x="' + sx(w) + '" y="' + (top - 12) + '" text-anchor="middle" class="t-muted">M' + Math.round(w / 4.33) + '</text>';
    rows.forEach((r, i) => {
      const y = top + i * rh;
      s += '<text x="' + (L - 10) + '" y="' + (y + 15) + '" text-anchor="end">' + esc(r.label.length > 46 ? r.label.slice(0, 45) + '…' : r.label) + '</text>';
      s += '<g data-tip="' + esc(r.label + ': weeks ' + Math.round(r.start) + '–' + Math.round(r.start + r.dur) + ' · about ' + H.fmt(r.effort) + ' person-days') + '"><rect x="' + sx(r.start) + '" y="' + (y + 4) + '" width="' + Math.max(3, sx(r.start + r.dur) - sx(r.start) - 2) + '" height="16" rx="4" fill="' + (col[r.kind] || C.s3) + '"/></g>';
    });
    (P.milestones || []).forEach((m) => { const x = sx(m.at); s += '<g data-tip="' + esc(m.label + ' · week ' + Math.round(m.at)) + '"><path d="M' + x + ',' + (hgt - 26) + ' l5,5 l-5,5 l-5,-5 z" fill="var(--ink)"/></g>'; });
